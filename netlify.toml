# Netlify: how to build Green Tag. The single-page fallback is public/_redirects
# and the "keep out of search results" header is public/_headers; both are
# copied into dist/ by the build.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19 or later.
  NODE_VERSION = "22"
